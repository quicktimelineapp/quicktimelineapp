<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Timeline Maker | No Sign-Up</title>
    <style>
        :root {
            --bg-color: #f9fafb;
            --surface: #ffffff;
            --primary: #2563eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--surface);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
        }
        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        main {
            display: flex;
            flex: 1;
            padding: 2rem;
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .editor-panel, .preview-panel {
            flex: 1;
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        textarea {
            flex: 1;
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            resize: none;
            font-family: monospace;
            font-size: 1rem;
            line-height: 1.5;
            outline: none;
        }
        textarea:focus {
            border-color: var(--primary);
        }
        .instructions {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 1rem;
        }
        /* Timeline Specific CSS */
        .timeline-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
        }
        .timeline {
            position: relative;
            max-width: 100%;
            margin: 0 auto;
        }
        .timeline::after {
            content: '';
            position: absolute;
            width: 4px;
            background-color: var(--primary);
            top: 0;
            bottom: 0;
            left: 50px;
            margin-left: -2px;
            border-radius: 2px;
        }
        .timeline-item {
            padding: 10px 0 30px 80px;
            position: relative;
            background-color: inherit;
            width: 100%;
        }
        .timeline-item::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            right: auto;
            background-color: var(--surface);
            border: 4px solid var(--primary);
            top: 15px;
            left: 50px;
            margin-left: -8px;
            border-radius: 50%;
            z-index: 1;
        }
        .date {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: block;
        }
        .content {
            background: var(--bg-color);
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        @media (max-width: 768px) {
            main {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>QuickTimelineMaker</h1>
        <p>Paste your notes. Get a timeline. No sign-up required.</p>
    </header>

    <main>
        <div class="editor-panel">
            <h2>1. Paste Your Data</h2>
            <textarea id="inputText" placeholder="Format: Date | Event
            
Example:
2020 | Started learning web development
2021 | Built my first portfolio
2022 | Landed a freelance client
2024 | Launched an automated timeline tool"></textarea>
            <p class="instructions">Format each line as <strong>Date | Event</strong>. The timeline updates instantly as you type.</p>
        </div>

        <div class="preview-panel">
            <h2>2. View Timeline</h2>
            <div class="timeline-container">
                <div class="timeline" id="timelineOutput">
                    </div>
            </div>
        </div>
    </main>

    <script>
        const inputText = document.getElementById('inputText');
        const timelineOutput = document.getElementById('timelineOutput');

        // Initial default text to show users how it works
        const defaultText = "January | Idea conceived\nFebruary | Prototype built\nMarch | Alpha testing begins\nApril | Public launch\nMay | Hit $1/day goal";
        inputText.value = defaultText;

        function renderTimeline() {
            const lines = inputText.value.split('\n');
            let html = '';

            lines.forEach(line => {
                // Ignore empty lines
                if (line.trim() === '') return;

                // Split by the pipe character "|"
                const parts = line.split('|');
                
                let date = '';
                let event = '';

                if (parts.length >= 2) {
                    date = parts[0].trim();
                    event = parts.slice(1).join('|').trim(); // Rejoin in case of multiple pipes
                } else {
                    // If no pipe is used, just make the whole line the event
                    event = line.trim();
                }

                html += `
                    <div class="timeline-item">
                        <div class="content">
                            ${date ? `<span class="date">${date}</span>` : ''}
                            <p>${event}</p>
                        </div>
                    </div>
                `;
            });

            timelineOutput.innerHTML = html;
        }

        // Listen for typing and update instantly
        inputText.addEventListener('input', renderTimeline);

        // Render the default timeline on load
        renderTimeline();
    </script>

</body>
</html>
